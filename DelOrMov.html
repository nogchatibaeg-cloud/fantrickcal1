<!-- DelOrMov.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: visible; }
    </style>
</head>
<body class="w-full h-full flex items-center justify-center p-1">

    <div class="flex items-center gap-2 bg-slate-900/95 backdrop-blur-md border border-slate-700 p-1.5 rounded-2xl shadow-2xl">
        <!-- 철거 버튼 -->
        <button id="btn-delete" class="px-3 py-2 bg-rose-600/90 hover:bg-rose-500 text-white font-extrabold text-xs rounded-xl shadow-md transition-all flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-trash-can"></i>
            <span>철거</span>
        </button>

        <!-- 이동 버튼 -->
        <button id="btn-move" class="px-3 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs rounded-xl shadow-md transition-all flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-arrows-up-down-left-right"></i>
            <span>이동</span>
        </button>

        <!-- 닫기 버튼 -->
        <button id="btn-close" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-extrabold text-xs rounded-xl shadow-md transition-all flex items-center justify-center cursor-pointer border border-slate-700">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <script>
        function sendAction(action) {
            window.parent.postMessage({
                type: 'BUILDING_ACTION',
                action: action
            }, '*');
        }

        document.getElementById('btn-delete').addEventListener('click', () => sendAction('delete'));
        document.getElementById('btn-move').addEventListener('click', () => sendAction('move'));
        document.getElementById('btn-close').addEventListener('click', () => sendAction('close'));
    </script>
</body>
</html>
