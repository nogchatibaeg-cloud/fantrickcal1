<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    </style>
</head>
<body>
    <!-- 🌟 핵심: bg-[#111827] (어두운 배경), border-[4px] border-[#f59e0b] (굵은 노란 테두리), rounded-[1.8rem] (카드 둥글기) -->
    <div class="w-full h-full bg-[#111827] border-[4px] border-[#f59e0b] rounded-[1.8rem] flex items-center justify-center relative p-2">
        
        <!-- 메인 건물 아이콘 (예시) -->
        <i class="fa-solid fa-industry text-amber-400 text-3xl"></i>

        <!-- 우측 상단/하단 동그란 코인 badge -->
        <div class="absolute top-1 right-1 w-6 h-6 bg-slate-900 border border-amber-400 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-coins text-amber-400 text-xs"></i>
        </div>
    </div>
</body>
</html>
