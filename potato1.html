<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: visible; }
    </style>
</head>
<!-- p-1.5 여백을 주어 튀어나온 배지가 자라나도 잘리지 않게 공간 확보 -->
<body class="w-full h-full flex items-center justify-center p-3">

    <!-- 건물 카드 본체 (overflow-visible 설정 필수) -->
    <div class="relative w-full h-full bg-slate-900 border-2 border-amber-400/80 rounded-2xl flex flex-col items-center justify-center shadow-xl overflow-visible">
        
        <!-- 1. 건물 대표 아이콘 (중앙) -->
        <div class="text-amber-400 text-2xl flex items-center justify-center">
            <i class="fa-solid fa-industry"></i>
        </div>

        <!-- 2. 알림 뱃지처럼 우상단 구석에 살짝 튀어나온 감자 아이콘 -->
        <!-- w-5 h-5 (작은 크기), -top-1.5 -right-1.5 (살짝 튀어나옴) -->
        <div class="absolute -top-0.5 -right-0.5 w-5 h-5 bg-amber-500 border-2 border-slate-950 rounded-full flex items-center justify-center shadow-md text-slate-950 text-[10px] z-10">
            <i class="fa-solid fa-database"></i>
        </div>

    </div>

</body>
</html>
