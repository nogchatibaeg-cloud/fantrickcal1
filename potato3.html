<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: visible; }
    </style>
</head>
<body class="w-full h-full flex items-center justify-center p-3">

    <!-- 건물 카드 본체 -->
    <div class="relative w-full h-full bg-slate-900 border-2 border-amber-400/80 rounded-2xl flex flex-col items-center justify-center shadow-xl overflow-visible">
        
        <!-- 1. 건물 대표 아이콘 (중앙 아이콘) -->
        <div class="text-amber-400 text-[100px] flex items-center justify-center">
            <i class="fa-solid fa-bolt"></i> <!-- 아이콘 클래스만 각 파일에 맞게 변경 -->
        </div>

        <!-- 2. 좌측 하단 감자 뱃지 아이콘 (원 지름 절반 축소: w-28 h-28 / 아이콘: text-[40px]) -->
        <div class="absolute -bottom-2 -left-2 w-28 h-28 bg-amber-500 border-2 border-slate-950 rounded-full flex items-center justify-center shadow-md text-slate-950 text-[40px] z-10">
            <i class="fa-solid fa-database fa-fw"></i>
        </div>

    </div>

</body>
</html>
