<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>적성 검사기 - 엘리아스 어웨이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { user-select: none; font-family: 'Gothic A1', sans-serif; box-sizing: border-box; }
        body { background-color: #050505; color: #22c55e; margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .pixel-font { font-family: 'VT323', monospace, 'Gothic A1'; }
        
        .crt-tv { background: linear-gradient(145deg, #2a2a2e, #151518); border: 12px solid #3f3f46; border-radius: 28px; box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.1); }
        .crt-screen { background-color: #031006; border: 4px solid #18181b; border-radius: 12px; box-shadow: inset 0 0 20px rgba(34, 197, 94, 0.2); position: relative; overflow: hidden; }
        .crt-screen::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 20; background-size: 100% 4px, 6px 100%; pointer-events: none; }
        
        .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 51%); background-size: 100% 4px; pointer-events: none; z-index: 21; }
        .glow-text { text-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }

        .scan-line-anim { position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: rgba(34, 197, 94, 0.5); box-shadow: 0 0 15px #22c55e; animation: scan 2s linear infinite; opacity: 0; z-index: 15; }
        @keyframes scan { 0% { top: 0; opacity: 0.8; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0.8; } }

        .btn-retro { background-color: #18181b; border: 2px solid #27272a; border-bottom: 5px solid #09090b; transition: all 0.1s ease; }
        .btn-retro:active { transform: translateY(3px); border-bottom-width: 2px; }
        .btn-retro:hover:not(:disabled) { border-color: #22c55e; color: #22c55e; }
    </style>
</head>
<body class="bg-black flex flex-col justify-center items-center relative">
    <div id="save-module-container"></div>

    <a href="InMonatium.html" class="absolute top-4 left-4 z-50 px-4 py-2 bg-zinc-900 border border-zinc-700 hover:border-green-500 rounded-xl text-zinc-300 text-xs font-bold flex items-center gap-2 transition-all">
        <i class="fa-solid fa-arrow-left"></i>
        <span>모나티엄으로 돌아가기</span>
    </a>

    <div class="crt-tv w-[95vw] max-w-[500px] h-[85vh] max-h-[700px] flex flex-col p-4 sm:p-6 relative">
        <div class="crt-screen flex-1 flex flex-col p-4 relative justify-between">
            <div class="scanline"></div>
            <div id="scan-bar" class="scan-line-anim"></div>

            <div class="flex justify-between items-center border-b border-green-900/60 pb-2 z-10">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-microchip text-green-500 animate-pulse"></i>
                    <span class="pixel-font text-lg text-green-400 font-bold tracking-widest glow-text">MONA-TESTER v2.0</span>
                </div>
                <div class="text-[10px] font-mono text-green-600 bg-green-950/40 px-2 py-0.5 rounded border border-green-900">
                    STATUS: READY
                </div>
            </div>

            <div class="flex-1 flex flex-col justify-center items-center my-4 relative z-10 w-full overflow-hidden">
                <div id="screen-idle" class="flex flex-col items-center justify-center text-center">
                    <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full border-2 border-green-500/30 flex items-center justify-center bg-green-950/10 mb-4 relative">
                        <i class="fa-solid fa-user-astronaut text-5xl sm:text-6xl text-green-500/40 animate-bounce"></i>
                    </div>
                    <p class="text-xs sm:text-sm text-green-400/80 font-mono leading-relaxed">
                        모나티엄 시민 적성 검사 시스템<br>
                        버튼을 눌러 적성 검사를 시작하세요.
                    </p>
                </div>

                <div id="screen-testing" class="hidden flex-col items-center justify-center text-center w-full">
                    <div class="w-32 h-32 sm:w-40 sm:h-40 relative flex items-center justify-center mb-4">
                        <i id="test-icon" class="fa-solid fa-gear text-6xl text-green-400 animate-spin"></i>
                    </div>
                    <div class="w-full bg-zinc-950 border border-green-900 h-4 rounded-full overflow-hidden p-0.5 mb-2">
                        <div id="test-progress" class="bg-green-500 h-full w-0 transition-all duration-100 rounded-full"></div>
                    </div>
                    <p id="test-status-text" class="pixel-font text-xl text-green-400 tracking-wider">적성 분석 중...</p>
                </div>

                <div id="screen-result" class="hidden flex-col items-center justify-center text-center w-full">
                    <div id="result-img-box" class="w-36 h-36 sm:w-44 sm:h-44 rounded-2xl border-2 border-green-400 bg-green-950/30 p-2 mb-3 relative flex items-center justify-center shadow-[0_0_20px_rgba(34,197,94,0.3)]">
                        <img id="result-img" src="" alt="결과" class="max-h-full max-w-full object-contain">
                        <span id="result-high-badge" class="hidden absolute top-2 right-2 bg-amber-400 text-black text-[10px] font-black px-2 py-0.5 rounded-full shadow">상급</span>
                    </div>
                    <h2 id="result-title" class="text-xl sm:text-2xl font-black text-white glow-text mb-1">군인 적성 판정</h2>
                    <p id="result-desc" class="text-xs text-green-300 font-mono max-w-[280px]">뛰어난 체력과 정신력으로 모나티엄을 지키는 데 적합합니다.</p>
                </div>
            </div>

            <div class="border-t border-green-900/60 pt-2 z-10 flex justify-between items-center text-[11px] font-mono text-green-600">
                <span>소모 골드: <span class="text-amber-400 font-bold">1,000 G</span></span>
                <span>보유 골드: <span id="user-gold" class="text-green-400 font-bold">0 G</span></span>
            </div>
        </div>

        <div class="mt-4 flex gap-3 z-30">
            <button id="btn-start-test" onclick="runGacha()" class="btn-retro flex-1 py-3 px-4 rounded-xl text-zinc-300 font-extrabold text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-play text-green-400"></i>
                <span>적성 검사 개시</span>
            </button>
        </div>
    </div>

    <script>
        const ROLES = [
            { id: 'army', name: '군인', img: 'army.png', desc: '뛰어난 체력과 정신력으로 모나티엄을 지키는 데 적합합니다.' },
            { id: 'backsu', name: '백수', img: 'backsu.png', desc: '특출난 능력은 없지만 모나티엄의 자유로운 분위기에 순응합니다.' },
            { id: 'doctor', name: '의사', img: 'doctor.png', desc: '지적인 능력과 치료 기술로 시민들의 건강을 책임집니다.' },
            { id: 'spy', name: '스파이', img: 'spy.png', desc: '은밀한 정보 수집과 침투에 특화된 재능을 가지고 있습니다.' },
            { id: 'citizen', name: '시민', img: 'citizen.png', desc: '성실함과 평범함으로 모나티엄의 기반을 이루는 주민입니다.' }
        ];

        let isTesting = false;

        function updateGoldUI() {
            try {
                const raw = localStorage.getItem('ELIAS_AWAY_SAVE_DATA_V1');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed.resources)) {
                        const goldRes = parsed.resources.find(r => r.id === 'gold');
                        if (goldRes) {
                            document.getElementById('user-gold').innerText = `${(goldRes.value || 0).toLocaleString()} G`;
                        }
                    }
                }
            } catch (e) { console.error(e); }
        }

        function runGacha() {
            if (isTesting) return;

            let saveData = null;
            try {
                const raw = localStorage.getItem('ELIAS_AWAY_SAVE_DATA_V1');
                if (raw) saveData = JSON.parse(raw);
            } catch (e) {}

            if (!saveData || !Array.isArray(saveData.resources)) {
                alert("게임 데이터를 불러올 수 없습니다.");
                return;
            }

            const goldRes = saveData.resources.find(r => r.id === 'gold');
            if (!goldRes || (goldRes.value || 0) < 1000) {
                alert("골드가 부족합니다! (필요: 1,000 G)");
                return;
            }

            // 골드 차감
            goldRes.value -= 1000;

            isTesting = true;
            document.getElementById('btn-start-test').disabled = true;
            document.getElementById('screen-idle').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-testing').classList.remove('hidden');
            document.getElementById('screen-testing').classList.add('flex');
            document.getElementById('scan-bar').style.opacity = '1';

            let progress = 0;
            const progressBar = document.getElementById('test-progress');
            const statusText = document.getElementById('test-status-text');

            const interval = setInterval(() => {
                progress += 5;
                progressBar.style.width = `${progress}%`;

                if (progress === 30) statusText.innerText = "뇌파 패턴 분석 중...";
                if (progress === 60) statusText.innerText = "적성 데이터 대조 중...";
                if (progress === 90) statusText.innerText = "최종 판정 기록 중...";

                if (progress >= 100) {
                    clearInterval(interval);

                    // 10% 확률 상급
                    const isHigh = Math.random() < 0.1;
                    const pickedRole = ROLES[Math.floor(Math.random() * ROLES.length)];

                    if (!saveData.progress) saveData.progress = {};
                    if (!Array.isArray(saveData.progress.monatiumCitizens)) {
                        saveData.progress.monatiumCitizens = [];
                    }

                    const currentList = saveData.progress.monatiumCitizens;
                    const sameRoleCount = currentList.filter(c => c.role === pickedRole.id).length;

                    let convertedToTicket = false;

                    // 적성당 최대 5명 제한 점검
                    if (sameRoleCount >= 5) {
                        // 5명 초과 시 엘프 교육권으로 변경
                        saveData.progress.elfEducationTickets = (saveData.progress.elfEducationTickets || 0) + 1;
                        convertedToTicket = true;
                    } else {
                        // 5명 미만인 경우 신규 등록
                        currentList.push({
                            role: pickedRole.id,
                            img: pickedRole.img,
                            isHighGrade: isHigh
                        });
                    }

                    // 저장 커밋
                    localStorage.setItem('ELIAS_AWAY_SAVE_DATA_V1', JSON.stringify(saveData));

                    setTimeout(() => {
                        document.getElementById('screen-testing').classList.add('hidden');
                        document.getElementById('screen-testing').classList.remove('flex');
                        document.getElementById('screen-result').classList.remove('hidden');
                        document.getElementById('screen-result').classList.add('flex');
                        document.getElementById('scan-bar').style.opacity = '0';

                        document.getElementById('result-img').src = pickedRole.img;
                        
                        if (convertedToTicket) {
                            document.getElementById('result-title').innerText = `${pickedRole.name} 적성 (교육권 전환)`;
                            document.getElementById('result-desc').innerText = `동일 적성 엘프 수용 한도(5명) 초과로 [엘프 교육권]으로 변환되었습니다!`;
                        } else {
                            document.getElementById('result-title').innerText = `${pickedRole.name} 적성 판정`;
                            document.getElementById('result-desc').innerText = pickedRole.desc;
                        }

                        const highBadge = document.getElementById('result-high-badge');
                        if (isHigh) highBadge.classList.remove('hidden');
                        else highBadge.classList.add('hidden');

                        isTesting = false;
                        document.getElementById('btn-start-test').disabled = false;
                        updateGoldUI();
                    }, 400);
                }
            }, 50);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('menu.html').then(res => res.text()).then(html => {
                const container = document.getElementById('save-module-container');
                if (container) {
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                }
            });
            updateGoldUI();
        });
    </script>
</body>
</html>
