<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: visible; }
    </style>
</head>
<body class="w-full h-full flex items-center justify-center p-2">

    <!-- 건물 카드 본체: 둥근 노란 테두리와 어두운 배경 -->
    <div class="relative w-16 h-16 bg-slate-900 border-4 border-amber-400 rounded-2xl flex items-center justify-center shadow-lg overflow-visible">
        
        <!-- 1. 건물 대표 아이콘 (중앙) -->
        <div class="text-amber-400 text-3xl flex items-center justify-center">
            <i class="fa-solid fa-kitchen-set"></i>
        </div>

        <!-- 2. 우상단 알림/감자 뱃지 -->
        <div class="absolute -top-0.5 -right-0.5 w-6 h-6 bg-slate-950 border-2 border-amber-400 rounded-full flex items-center justify-center text-amber-400 text-[10px] z-10 shadow-md">
            <i class="fa-solid fa-database"></i>
        </div>

    </div>

</body>
</html>
