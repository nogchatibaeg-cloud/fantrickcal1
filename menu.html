<!-- menu.html -->
<style>
    /* Drawer Menu Style */
    #global-menu-drawer {
        position: fixed;
        top: 0;
        right: -320px;
        width: 300px;
        height: 100vh;
        background-color: #1e1e24;
        color: #ffffff;
        box-shadow: -4px 0 15px rgba(0, 0, 0, 0.5);
        transition: right 0.3s ease-in-out;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
        font-family: sans-serif;
    }
    #global-menu-drawer.open {
        right: 0;
    }
    #menu-drawer-toggle-btn {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 100000;
        background: #2b2d42;
        color: #fff;
        border: 1px solid #4a4e69;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .menu-header {
        font-size: 1.2rem;
        font-weight: bold;
        border-bottom: 2px solid #4a4e69;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    .menu-btn {
        background: #3a3d52;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 10px;
        cursor: pointer;
        text-align: left;
        font-size: 0.95rem;
        transition: background 0.2s;
    }
    .menu-btn:hover {
        background: #4a4e69;
    }
    .menu-btn.danger {
        background: #8d99ae;
        color: #d90429;
        font-weight: bold;
        margin-top: auto;
    }
    .menu-btn.danger:hover {
        background: #d90429;
        color: #fff;
    }
    
    /* Confirm Modal */
    #menu-confirm-modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        z-index: 100001;
        justify-content: center;
        align-items: center;
    }
    #menu-confirm-modal.active {
        display: flex;
    }
    .modal-box {
        background: #2b2d42;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        max-width: 300px;
    }
    .modal-btns {
        margin-top: 15px;
        display: flex;
        justify-content: space-around;
    }
    .modal-btns button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    /* Toast Msg */
    #menu-toast-msg {
        position: fixed;
        bottom: -50px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        z-index: 100002;
        transition: bottom 0.3s ease;
        pointer-events: none;
    }
    #menu-toast-msg.show {
        bottom: 20px;
    }
</style>

<button id="menu-drawer-toggle-btn">☰ 메뉴</button>

<div id="global-menu-drawer">
    <div class="menu-header">게임 메뉴</div>
    <button class="menu-btn" id="btn-action-save">💾 게임 저장</button>
    <button class="menu-btn" id="btn-action-export">📤 세이브 파일 내보내기</button>
    <button class="menu-btn" id="btn-action-import">📥 세이브 파일 불러오기</button>
    <input type="file" id="input-import-file" accept=".json" style="display: none;" />
    
    <button class="menu-btn danger" id="btn-action-reset">⚠️ 데이터 초기화</button>
</div>

<div id="menu-confirm-modal">
    <div class="modal-box">
        <p>정말로 모든 진행 데이터를 초기화하시겠습니까?</p>
        <div class="modal-btns">
            <button id="btn-confirm-yes" style="background:#d90429; color:white;">예</button>
            <button id="btn-confirm-no" style="background:#8d99ae; color:white;">아니오</button>
        </div>
    </div>
</div>

<div id="menu-toast-msg"><span id="menu-toast-text">저장되었습니다.</span></div>

<script>
if (window.location.pathname.includes('loading.html')) {
    const drawer = document.getElementById('global-menu-drawer');
    const toggleBtn = document.getElementById('menu-drawer-toggle-btn');
    if (drawer) drawer.style.display = 'none';
    if (toggleBtn) toggleBtn.style.display = 'none';
} else {
    const SAVE_KEY = 'ELIAS_AWAY_SAVE_DATA_V1';
    const AUTO_SAVE_INTERVAL = 5 * 60 * 1000; // 5분 자동 저장

    // 1. 현재 화면의 데이터를 기존 세이브 데이터와 통합 (Merge)
    function collectAllGameData() {
        let existingData = {};
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (raw) existingData = JSON.parse(raw);
        } catch (e) {
            console.error("기존 세이브 데이터 읽기 실패:", e);
        }

        // A. 자원 데이터 수집
        let resources = existingData.resources || null;
        if (window.PLAYER_RESOURCES_DATA) {
            resources = window.PLAYER_RESOURCES_DATA.map(r => ({
                id: r.id, 
                value: r.value, 
                rawValue: r.rawValue, 
                processedValue: r.processedValue
            }));
        }

        // B. 지도(Gamemap) 데이터 수집
        let mapData = existingData.mapData || { currentDay: 1, expeditionsLeft: 5, regions: null };
        if (typeof currentDay !== 'undefined') mapData.currentDay = currentDay;
        if (typeof expeditionsLeft !== 'undefined') mapData.expeditionsLeft = expeditionsLeft;
        if (typeof REGIONS_DATA !== 'undefined') mapData.regions = JSON.parse(JSON.stringify(REGIONS_DATA));

        // C. 모나티엄(InMonatium) 건물 배치 데이터 수집
        let buildings = existingData.buildings || [];
        if (typeof placedBuildings !== 'undefined' && Array.isArray(placedBuildings) && placedBuildings.length > 0) {
            buildings = placedBuildings.map(b => ({
                col: b.col, 
                row: b.row, 
                data: b.data
            }));
        }

        return {
            saveTime: new Date().toISOString(),
            resources: resources,
            mapData: mapData,
            buildings: buildings
        };
    }

    // 2. 통합 세이브 함수
    window.saveGameState = function(isAuto = false) {
        try {
            const data = collectAllGameData();
            localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            console.log('[SaveSystem] 데이터 저장 완료:', data);
            if (!isAuto) showSaveToast("게임 데이터가 성공적으로 저장되었습니다.");
        } catch (err) {
            console.error("[SaveSystem] 저장 실패:", err);
            if (!isAuto) showSaveToast("저장 중 오류가 발생했습니다.");
        }
    };

    // 3. 통합 로드 함수
    window.loadGameState = function() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return null;
            const parsed = JSON.parse(raw);

            // A. 자원 데이터 동기화
            if (parsed.resources && window.PLAYER_RESOURCES_DATA) {
                parsed.resources.forEach(savedRes => {
                    const target = window.PLAYER_RESOURCES_DATA.find(r => r.id === savedRes.id);
                    if (target) {
                        if (savedRes.value !== undefined) target.value = savedRes.value;
                        if (savedRes.rawValue !== undefined) target.rawValue = savedRes.rawValue;
                        if (savedRes.processedValue !== undefined) target.processedValue = savedRes.processedValue;
                    }
                });
                if (typeof window.renderPlayerResourcesUI === 'function') {
                    window.renderPlayerResourcesUI();
                }
            }

            // B. 지도(Gamemap) 데이터 동기화
            if (parsed.mapData) {
                if (typeof currentDay !== 'undefined' && parsed.mapData.currentDay) {
                    window.currentDay = parsed.mapData.currentDay;
                    const el = document.getElementById('header-day-count');
                    if (el) el.innerText = `Day ${window.currentDay}`;
                }
                if (typeof expeditionsLeft !== 'undefined' && parsed.mapData.expeditionsLeft) {
                    window.expeditionsLeft = parsed.mapData.expeditionsLeft;
                    const el = document.getElementById('header-expedition-count');
                    if (el) el.innerText = `${window.expeditionsLeft}/5`;
                }
                if (typeof REGIONS_DATA !== 'undefined' && parsed.mapData.regions) {
                    Object.assign(REGIONS_DATA, parsed.mapData.regions);
                    if (typeof renderStatusBadges === 'function') renderStatusBadges();
                }
            }

            // C. 모나티엄(InMonatium) 건물 동기화
            if (parsed.buildings && typeof placedBuildings !== 'undefined' && Array.isArray(placedBuildings)) {
                placedBuildings.length = 0;
                const buildingLayer = document.getElementById('building-html-layer');
                if (buildingLayer) buildingLayer.innerHTML = '';

                parsed.buildings.forEach(b => {
                    placedBuildings.push(b);
                    if (typeof addBuildingElement === 'function') {
                        addBuildingElement(b);
                    }
                });
            }
            return parsed;
        } catch (err) {
            console.error("[SaveSystem] 불러오기 실패:", err);
            return null;
        }
    };

    // 4. 초기화 함수
    window.clearGameState = function() {
        localStorage.removeItem(SAVE_KEY);
        window.location.reload();
    };

    function showSaveToast(msg) {
        const toast = document.getElementById('menu-toast-msg');
        const toastText = document.getElementById('menu-toast-text');
        if (!toast || !toastText) return;

        toastText.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // UI 이벤트 리스너 연결
    function setupMenuEvents() {
        const drawer = document.getElementById('global-menu-drawer');
        const toggleBtn = document.getElementById('menu-drawer-toggle-btn');
        const btnSave = document.getElementById('btn-action-save');
        const btnReset = document.getElementById('btn-action-reset');
        const confirmModal = document.getElementById('menu-confirm-modal');
        const btnYes = document.getElementById('btn-confirm-yes');
        const btnNo = document.getElementById('btn-confirm-no');
        const btnExport = document.getElementById('btn-action-export');
        const btnImport = document.getElementById('btn-action-import');
        const inputImportFile = document.getElementById('input-import-file');

        if (toggleBtn && drawer) {
            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                drawer.classList.toggle('open');
            });
        }

        if (btnSave) {
            btnSave.addEventListener('click', (e) => {
                e.stopPropagation();
                window.saveGameState(false);
            });
        }

        if (btnExport) {
            btnExport.addEventListener('click', (e) => {
                e.stopPropagation();
                window.saveGameState(true);
                const currentData = localStorage.getItem(SAVE_KEY);
                if (!currentData) {
                    showSaveToast("내보낼 데이터가 없습니다.");
                    return;
                }
                const blob = new Blob([currentData], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `elias_save_backup_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                showSaveToast("백업 파일이 다운로드되었습니다.");
            });
        }

        if (btnImport && inputImportFile) {
            btnImport.addEventListener('click', (e) => {
                e.stopPropagation();
                inputImportFile.click();
            });

            inputImportFile.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed && (parsed.resources || parsed.mapData || parsed.buildings)) {
                            localStorage.setItem(SAVE_KEY, JSON.stringify(parsed));
                            showSaveToast("백업 데이터를 적용했습니다.");
                            setTimeout(() => window.location.reload(), 1000);
                        } else {
                            alert("올바르지 않은 세이브 파일 형식입니다.");
                        }
                    } catch (err) {
                        alert("세이브 파일을 읽는 도중 오류가 발생했습니다.");
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            });
        }

        if (btnReset) {
            btnReset.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirmModal) confirmModal.classList.add('active');
            });
        }

        if (btnYes) btnYes.addEventListener('click', () => window.clearGameState());
        if (btnNo) btnNo.addEventListener('click', () => { if (confirmModal) confirmModal.classList.remove('active'); });
    }

    setupMenuEvents();
    window.loadGameState();

    // 5분 마다 자동 저장
    setInterval(() => {
        window.saveGameState(true);
    }, AUTO_SAVE_INTERVAL);
}
</script>
