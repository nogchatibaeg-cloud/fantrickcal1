<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: visible; }
    </style>
</head>
<body class="w-full h-full flex items-center justify-center p-4">

    <!-- 🌟 [어두운 검은색 배경 + 노란색 테두리 + 모서리가 약간 둥근 건물 카드] -->
    <div class="relative w-full h-full bg-slate-900 border-4 border-amber-400/90 rounded-3xl flex flex-col items-center justify-center shadow-2xl overflow-visible">
        
        <!-- 1. 건물 대표 아이콘 (중앙) -->
        <div class="text-amber-400 text-6xl flex items-center justify-center">
            <i class="fa-solid fa-plug-circle-bolt"></i>
        </div>

        <!-- 2. 우상단 감자 뱃지 아이콘 -->
        <div class="absolute -top-2 -right-2 w-10 h-10 bg-amber-500 border-4 border-slate-950 rounded-full flex items-center justify-center shadow-lg text-slate-950 text-base font-bold z-10">
            <i class="fa-solid fa-database"></i>
        </div>

    </div>

</body>
</html>
