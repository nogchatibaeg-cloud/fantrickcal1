<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen w-screen flex flex-col items-center justify-center m-0 overflow-hidden">

    <!-- 화면 중앙 지역명 표시 -->
    <h1 class="text-4xl font-extrabold text-amber-400 tracking-widest drop-shadow-lg">
        정령산 <!-- ⚠️ 파일에 맞게 지역명 수정 (예: 모나티엄, 에르피엔 등) -->
    </h1>

    <!-- (선택) 지도 복귀 버튼 -->
    <a href="loading.html?target=Gamemap.html" class="mt-8 px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-bold rounded-xl border border-slate-700 transition-all">
        ← 지도로 돌아가기
    </a>
<div id="save-module-container"></div>
    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(html => {
                const container = document.getElementById('save-module-container');
                container.innerHTML = html;
                
                // 불러온 HTML 내의 <script> 태그를 실행시키기 위한 처리
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.error('menu.html 로드 실패:', err));
    </script>
</body>
</html>
