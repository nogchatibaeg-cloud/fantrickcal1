<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로딩 중... - 엘리아스 어웨이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            user-select: none;
            font-family: 'Gothic A1', sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gear-spinner {
            width: 110px;
            height: 110px;
            background-color: #ffffff;
            -webkit-mask-image: url('images (4).jpeg');
            mask-image: url('images (4).jpeg');
            -webkit-mask-size: cover;
            mask-size: cover;
            -webkit-mask-position: center;
            mask-position: center;
            animation: spin 3s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            border-radius: 9999px;
            transition: width 0.05s linear;
        }

        .tip-fade {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="loading-container" class="relative w-full h-full flex flex-col items-center justify-center p-6 bg-[#0d0e15]">
        
        <div class="mb-10 flex flex-col items-center justify-center">
            <div class="gear-spinner"></div>
        </div>

        <div class="w-full max-w-md flex flex-col items-center gap-3">
            <div class="w-full flex justify-between items-center text-xs text-gray-400 font-bold px-1">
                <span class="tracking-widest uppercase">LOADING...</span>
                <span id="loading-percent" class="text-white font-extrabold text-sm">0%</span>
            </div>

            <div class="w-full h-2.5 bg-white/10 rounded-full p-0.5 backdrop-blur-sm border border-white/10 overflow-hidden">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>

            <!-- 실제 저장 진행 상태 -->
            <p id="save-status" class="text-[11px] text-gray-400 font-medium tracking-tight min-h-[16px] text-center"></p>

            <!-- 저장 실패 시 나타나는 안내 -->
            <div id="save-error-panel" class="hidden w-full flex flex-col items-center gap-2 mt-1">
                <p id="save-error-text" class="text-[11px] text-red-400/90 font-medium tracking-tight text-center leading-relaxed"></p>
                <div class="flex items-center gap-2">
                    <button id="btn-save-retry" class="px-3.5 py-1.5 text-[11px] font-bold rounded-lg bg-white/10 hover:bg-white/20 border border-white/30 text-white transition-all">다시 시도</button>
                    <button id="btn-save-skip" class="px-3.5 py-1.5 text-[11px] font-bold rounded-lg bg-transparent hover:bg-white/10 border border-white/15 text-gray-400 hover:text-white transition-all">저장 없이 계속</button>
                </div>
            </div>

            <!-- 게임 팁 표시 영역 -->
            <div class="mt-4 text-center min-h-[48px] flex items-center justify-center">
                <p id="tip-text" class="text-xs sm:text-sm text-gray-300 font-medium leading-relaxed tracking-tight tip-fade">
                </p>
            </div>

            <!-- 오류 안내 메시지 (목적지 경로 부재 시 나타남) -->
            <div id="error-message" class="hidden mt-2 text-center">
                <p class="text-[10px] text-red-400/90 font-medium tracking-tight">
                    ⚠️ 게임에 오류가 생겨 메인 화면으로 돌아갑니다.
                </p>
            </div>
        </div>
    </div>

    <script>
        const GAME_TIPS = [
            "tmi<br>본 게임은 개발자의 첫 작품이자 그림을 제외한 첫 2차 창작입니다!",
            "tmi<br>응원은 정말정말 큰 힘이 됩니다!",
            "tmi<br>감자 300만개는 약 600톤이라네요 ㄷㄷ",
            "tmi<br>제작자 최애 엘프는 엘레나입니다.",
            "tmi<br>제작자는 요미 때 입문한 볼뉴비입니다! 여러분은 언제이신가요?"
        ];

        const FALLBACK_MAIN_URL = "Gamemain.html"; // 기본 메인 화면 파일명

        function URL_PARAMS_GET(key) {
            const params = new URLSearchParams(window.location.search);
            return params.get(key);
        }

        const targetParam = URL_PARAMS_GET('target');
        let TARGET_URL = targetParam;
        let isErrorMode = false;

        // 목적지 경로가 없거나 전달되지 않은 경우 처리
        if (!targetParam || targetParam.trim() === "") {
            TARGET_URL = FALLBACK_MAIN_URL;
            isErrorMode = true;
        }

        function startLoadingSequence(onComplete) {
            const progressBar = document.getElementById('progress-bar');
            const percentText = document.getElementById('loading-percent');

            animateProgress(0, 70, 600, () => {
                animateProgress(70, 80, 1000, () => {
                    animateProgress(80, 90, 400, () => {
                        stutterProgress(90, 100, () => {
                            if (onComplete) onComplete();
                        });
                    });
                });
            });

            function animateProgress(start, end, duration, callback) {
                const startTime = performance.now();
                function update(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const currentVal = Math.floor(start + (end - start) * progress);
                    
                    progressBar.style.width = currentVal + '%';
                    percentText.innerText = currentVal + '%';

                    if (progress < 1) {
                        requestAnimationFrame(update);
                    } else if (callback) {
                        callback();
                    }
                }
                requestAnimationFrame(update);
            }

            function stutterProgress(start, end, callback) {
                progressBar.style.width = '94%';
                percentText.innerText = '94%';

                setTimeout(() => {
                    progressBar.style.width = '98%';
                    percentText.innerText = '98%';
                    
                    setTimeout(() => {
                        progressBar.style.width = '100%';
                        percentText.innerText = '100%';
                        setTimeout(callback, 200);
                    }, 400);
                }, 300);
            }
        }

        function setRandomTip() {
            const tipElement = document.getElementById('tip-text');
            const randomIndex = Math.floor(Math.random() * GAME_TIPS.length);
            tipElement.innerHTML = GAME_TIPS[randomIndex];
        }

        /* ------------------------------------------------------------------
         *  실제 저장 연동 로딩
         *  이전 화면이 남긴 임시 저장본을 menu.html 의 저장 엔진(EliasSave)으로
         *  검사 → 확정 → 검증한 뒤에만 100% 가 되고 다음 화면으로 넘어간다.
         * ------------------------------------------------------------------ */
        let currentPct = 0;
        let isNavigating = false;

        function setPct(v) {
            const val = Math.max(currentPct, Math.min(100, Math.floor(v)));
            currentPct = val;
            document.getElementById('progress-bar').style.width = val + '%';
            document.getElementById('loading-percent').innerText = val + '%';
        }

        function tweenTo(target, duration) {
            return new Promise(resolve => {
                const from = currentPct;
                if (target <= from || duration <= 0) { setPct(target); resolve(); return; }
                const startTime = performance.now();
                function frame(now) {
                    const p = Math.min((now - startTime) / duration, 1);
                    setPct(from + (target - from) * p);
                    if (p < 1) requestAnimationFrame(frame);
                    else { setPct(target); resolve(); }
                }
                requestAnimationFrame(frame);
            });
        }

        function setSaveStatus(text) {
            const el = document.getElementById('save-status');
            if (el) el.innerText = text || '';
        }

        // EliasSave 가 콜백으로 호출: 문구를 바꾸고 진행바를 목표치까지 움직인 뒤 resolve
        function reportStep(label, pct, minMs) {
            setSaveStatus(label);
            return tweenTo(pct, minMs);
        }

        function goToTarget() {
            if (isNavigating) return;
            isNavigating = true;
            document.getElementById('loading-container').style.transition = 'opacity 0.3s ease';
            document.getElementById('loading-container').style.opacity = '0';

            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 300);
        }

        // menu.html 에서 저장 엔진 스크립트만 꺼내 실행 (메뉴 UI 는 이 화면에 붙이지 않는다)
        function loadSaveEngine() {
            if (window.EliasSave) return Promise.resolve(true);
            return fetch('menu.html', { cache: 'no-cache' })
                .then(response => {
                    if (!response.ok) throw new Error('menu.html ' + response.status);
                    return response.text();
                })
                .then(html => {
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    doc.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        document.head.appendChild(newScript);
                    });
                    return !!window.EliasSave;
                });
        }

        function summaryText(summary, committed) {
            const head = committed ? '저장 완료' : '저장 확인 완료';
            if (!summary) return head;
            const parts = [];
            if (summary.day !== undefined) parts.push('Day ' + summary.day);
            parts.push('자원 ' + summary.resources + '종');
            parts.push('지역 ' + summary.regions + '곳');
            parts.push('건물 ' + summary.buildings + '채');
            return head + ' - ' + parts.join(', ');
        }

        function showSaveError(message) {
            document.getElementById('save-error-text').innerText =
                '저장에 실패했습니다: ' + message + ' 브라우저 저장 공간을 확인한 뒤 다시 시도해 주세요.';
            document.getElementById('save-error-panel').classList.remove('hidden');
        }

        function hideSaveError() {
            document.getElementById('save-error-panel').classList.add('hidden');
        }

        async function runSaveSequence() {
            hideSaveError();
            const result = await window.EliasSave.finalizeForNavigation(reportStep);

            if (!result.ok) {
                setSaveStatus('저장을 완료하지 못해 이동을 멈췄습니다.');
                showSaveError(result.error || '알 수 없는 오류');
                return;
            }

            let doneText = result.summary ? summaryText(result.summary, result.committed) : '저장된 기록이 없어 새 진행으로 시작합니다.';
            if (result.notes && result.notes.length) doneText += ' (' + result.notes.join(' ') + ')';
            setSaveStatus(doneText);
            await tweenTo(100, 350);
            await new Promise(resolve => setTimeout(resolve, 250));
            goToTarget();
        }

        async function startSaveLoadingSequence() {
            setSaveStatus('저장 준비 중...');
            let engineReady = false;
            try {
                engineReady = await loadSaveEngine();
            } catch (err) {
                console.warn('저장 엔진(menu.html)을 불러오지 못했습니다:', err);
            }

            if (!engineReady) {
                // 저장 엔진이 없으면 (이전 화면도 저장할 수 없었으므로) 기존 연출 로딩으로 대체
                startLoadingSequence(goToTarget);
                return;
            }
            await runSaveSequence();
        }

        window.onload = function() {
            setRandomTip();

            // 오류 상황일 경우 오류 문구 노출
            if (isErrorMode) {
                const errorMsgEl = document.getElementById('error-message');
                if (errorMsgEl) errorMsgEl.classList.remove('hidden');
            }

            document.getElementById('btn-save-retry').addEventListener('click', () => { runSaveSequence(); });
            document.getElementById('btn-save-skip').addEventListener('click', () => {
                // 임시 저장본은 남아 있으므로 다음 화면이 열릴 때 한 번 더 확정을 시도한다
                setSaveStatus('저장 없이 이동합니다.');
                tweenTo(100, 200).then(goToTarget);
            });

            startSaveLoadingSequence();
        };
    </script>
</body>
</html>
