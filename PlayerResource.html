<!-- PlayerResource.html -->
<script>
(function() {
    if (document.getElementById('player-resource-root')) return;

    const externalContainer = document.getElementById('resource-module-container');
    const container = externalContainer || document.createElement('div');
    container.id = 'player-resource-root';
    
    if (!externalContainer) {
        container.className = 'fixed bottom-24 left-4 w-36 z-50 pointer-events-auto shadow-2xl transition-transform duration-300 ease-in-out';
    } else {
        container.classList.add('w-36', 'pointer-events-auto', 'transition-transform', 'duration-300', 'ease-in-out');
    }
    
    container.innerHTML = `
        <div class="bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-xl p-3 relative shadow-2xl">
            <button id="btn-toggle-resource" class="absolute -right-6 top-1/2 -translate-y-1/2 w-6 h-12 bg-slate-900/95 border-r border-t border-b border-slate-700 text-slate-300 hover:text-amber-400 rounded-r-lg flex items-center justify-center shadow-lg transition-colors cursor-pointer z-30 focus:outline-none">
                <i id="resource-toggle-icon" class="fa-solid fa-chevron-left text-[10px]"></i>
            </button>
            <h3 class="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-2.5 flex items-center justify-between border-b border-slate-800 pb-1.5">
                <span>보유 자원</span>
                <i class="fa-solid fa-boxes-stacked text-amber-500 text-xs"></i>
            </h3>
            <div class="space-y-2 text-[11px]" id="resource-list-container">
            </div>
        </div>
    `;

    if (!externalContainer) {
        document.body.prepend(container);
    }

    // 전역 자원 원본 배열 정의
    if (!window.PLAYER_RESOURCES_DATA) {
        window.PLAYER_RESOURCES_DATA = [
            { id: "tech", name: "기술력", icon: "fa-solid fa-microchip", color: "text-teal-400", value: 10, unit: "", desc: "<b>모성에서도, 지구에서도 끊임없이 발휘되는, 무엇이든 만들 수 있는 기술력이다. 주로 우리 스스로 늘려야 한다.</b><br><br>\"엘프들의 기술력은 우주 제일!\" - 오르", goodRegions: ["elf"], badRegions: [] },
            { id: "power", name: "전력", icon: "fa-solid fa-bolt-lightning", color: "text-yellow-300", value: 0, unit: "W", max: 100, desc: "<b>에너지를 여러 방식으로 가공하여 만들어낸 자원. 문명에 필수적이다.</b>", goodRegions: ["elf"], badRegions: ["fairy", "witch", "spirit", "dragon", "beast", "ghost"] },
            { id: "food", name: "식량", icon: "fa-solid fa-utensils", color: "text-orange-400", rawValue: 0, processedValue: 0, unit: "", desc: "<b>가공해야 식사로 이용 가능합니다. 수인들에게서 주로 얻습니다.</b>", goodRegions: ["beast"], badRegions: ["spirit", "ghost"] },
            { id: "leaf", name: "세계수 잎", icon: "fa-solid fa-leaf", color: "text-emerald-400", value: 0, unit: "", desc: "<b>신비한 현상을 일으키는 세계수의 잎사귀.</b>", goodRegions: ["fairy", "witch"], badRegions: ["ghost"] },
            { id: "mana", name: "마력", icon: "fa-solid fa-wand-magic-sparkles", color: "text-purple-400", value: 0, unit: "", desc: "<b>기술 접목이 가능한 자원.</b>", goodRegions: ["witch"], badRegions: ["beast"] },
            { id: "mineral", name: "자재", icon: "fa-solid fa-gem", color: "text-amber-400", rawValue: 0, processedValue: 0, unit: "", desc: "<b>건축 및 가공 자재. 광물 자원.</b>", goodRegions: ["dragon"], badRegions: ["fairy"] },
            { id: "energy", name: "에너지", icon: "fa-solid fa-bolt", color: "text-cyan-400", value: 0, unit: "", desc: "<b>정령들에게서 무한히 추출되는 에너지.</b>", goodRegions: ["spirit"], badRegions: ["fairy", "witch", "dragon", "beast", "ghost", "elf"] },
            { id: "efficiency", name: "효율성", icon: "fa-solid fa-gauge-high", color: "text-rose-400", value: 0, unit: "%", desc: "<b>차원문 가동 효율.</b>", goodRegions: ["ghost"], badRegions: ["fairy", "witch", "dragon", "spirit", "beast", "elf"] },
            { id: "potato", name: "감자", icon: "fa-solid fa-database", color: "text-yellow-600", value: 3000927, unit: "개", desc: "<b>주식으로 사용하는 감자.</b>", goodRegions: [], badRegions: [] },
            { id: "gold", name: "골드", icon: "fa-solid fa-coins", color: "text-yellow-400", value: 0, unit: "G", desc: "<b>기본 화폐.</b>", goodRegions: [], badRegions: [] }
        ];
    }

    const gainTimers = {};
    const gainAmounts = {};

    window.notifyResourceGain = function(resourceId, amount) {
        if (!amount || amount <= 0) return;

        if (gainAmounts[resourceId]) gainAmounts[resourceId] += amount;
        else gainAmounts[resourceId] = amount;

        if (gainTimers[resourceId]) clearTimeout(gainTimers[resourceId]);

        updateGainBadgeUI(resourceId);

        gainTimers[resourceId] = setTimeout(() => {
            delete gainAmounts[resourceId];
            delete gainTimers[resourceId];
            removeGainBadgeUI(resourceId);
        }, 3000);
    };

    function updateGainBadgeUI(resourceId) {
        const itemEl = document.querySelector(`.resource-item[data-resource-id="${resourceId}"]`);
        if (!itemEl) return;

        const resData = window.PLAYER_RESOURCES_DATA.find(r => r.id === resourceId);
        if (!resData) return;

        let badgeEl = itemEl.querySelector(`.resource-gain-badge`);
        if (!gainAmounts[resourceId]) {
            if (badgeEl) badgeEl.remove();
            return;
        }

        if (!badgeEl) {
            badgeEl = document.createElement('div');
            badgeEl.className = 'resource-gain-badge absolute left-full top-1/2 -translate-y-1/2 ml-2.5 flex items-center gap-1.5 px-2.5 py-1 bg-slate-900/95 border border-emerald-500/80 rounded-lg shadow-2xl backdrop-blur-md pointer-events-none z-50 whitespace-nowrap';
            itemEl.appendChild(badgeEl);
        }

        badgeEl.innerHTML = `
            <i class="${resData.icon} ${resData.color} text-[11px]"></i>
            <span class="text-[11px] font-black text-emerald-400 font-mono">+${gainAmounts[resourceId].toLocaleString()}</span>
        `;
    }

    function removeGainBadgeUI(resourceId) {
        const itemEl = document.querySelector(`.resource-item[data-resource-id="${resourceId}"]`);
        if (!itemEl) return;
        const badgeEl = itemEl.querySelector(`.resource-gain-badge`);
        if (badgeEl) badgeEl.remove();
    }

    window.renderPlayerResourcesUI = function() {
        const listContainer = document.getElementById('resource-list-container');
        if (!listContainer) return;

        listContainer.innerHTML = window.PLAYER_RESOURCES_DATA.map(res => {
            let displayVal = '';
            if (res.id === 'food' || res.id === 'mineral') {
                const proc = (res.processedValue || 0).toLocaleString();
                const raw = (res.rawValue || 0).toLocaleString();
                displayVal = `${proc} (미가공 ${raw})`;
            } else if (typeof res.value === 'number') {
                displayVal = res.value.toLocaleString();
            } else {
                displayVal = res.value || '0';
            }

            return `
            <div class="resource-item group relative flex items-center justify-between cursor-pointer py-0.5" data-resource-id="${res.id}">
                <div class="flex items-center gap-1.5 truncate">
                    <i class="${res.icon} ${res.color} text-[10px] w-3.5 text-center"></i>
                    <span class="text-slate-300 font-bold truncate text-[10px]">${res.name}</span>
                </div>
                <span class="text-[10px] font-extrabold text-slate-200 font-mono">${displayVal}${res.unit || ''}</span>
                
                <div class="tooltip-content absolute left-full top-1/2 -translate-y-1/2 ml-3 w-64 bg-slate-900/95 border border-slate-700 text-slate-200 text-xs rounded-xl p-3 shadow-2xl z-50 pointer-events-none backdrop-blur-md hidden group-hover:block">
                    <div class="font-extrabold text-amber-400 mb-1 border-b border-slate-800 pb-1 flex items-center gap-1.5">
                        <i class="${res.icon} ${res.color}"></i> ${res.name}
                    </div>
                    <div class="text-[11px] leading-relaxed">${res.desc}</div>
                </div>
            </div>
            `;
        }).join('');

        listContainer.querySelectorAll('.resource-item').forEach(item => {
            item.addEventListener('mouseenter', () => {
                const resId = item.dataset.resourceId;
                const resData = window.PLAYER_RESOURCES_DATA.find(r => r.id === resId);
                if (resData && window.highlightRegionsByResource) {
                    window.highlightRegionsByResource(resData.goodRegions, resData.badRegions);
                }
            });
            item.addEventListener('mouseleave', () => {
                if (window.resetRegionHighlights) window.resetRegionHighlights();
            });
        });

        Object.keys(gainAmounts).forEach(resourceId => {
            if (gainAmounts[resourceId] > 0) updateGainBadgeUI(resourceId);
        });
    };

    let isCollapsed = false;
    const toggleBtn = document.getElementById('btn-toggle-resource');
    const toggleIcon = document.getElementById('resource-toggle-icon');

    window.setPlayerResourceCollapsed = function(shouldCollapse) {
        isCollapsed = shouldCollapse;
        if (isCollapsed) {
            container.style.transform = 'translateX(calc(-100% - 1rem))';
            if (toggleIcon) toggleIcon.className = 'fa-solid fa-chevron-right text-[10px]';
        } else {
            container.style.transform = 'translateX(0)';
            if (toggleIcon) toggleIcon.className = 'fa-solid fa-chevron-left text-[10px]';
        }
    };

    if (toggleBtn) {
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.setPlayerResourceCollapsed(!isCollapsed);
        });
    }

    window.renderPlayerResourcesUI();
})();
</script>
