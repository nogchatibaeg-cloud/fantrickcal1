<!-- epicelf.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>엘프 목록 - 엘리아스 어웨이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; font-family: 'Gothic A1', sans-serif; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            background-color: #030a16;
            margin: 0; padding: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .cyber-grid {
            background-color: #030d1e;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            box-shadow: inset 0 0 100px rgba(14, 165, 233, 0.2);
        }

        #elf-detail-view {
            --stage-w: clamp(150px, min(36vw, 36vh), 340px);
        }
        .stage {
            width: var(--stage-w);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stage-elf {
            width: 100%;
            height: auto;
            max-height: calc(var(--stage-w) * 1.7);
            object-fit: contain;
            position: relative;
            z-index: 10;
            margin-bottom: calc(var(--stage-w) * -0.06);
            filter: drop-shadow(0 10px 25px rgba(56, 189, 248, 0.5));
        }

        .platform-halo {
            width: 100%;
            aspect-ratio: 220 / 50;
            background: #000000;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 40px rgba(56, 189, 248, 0.8), inset 0 0 15px #ffffff;
            position: relative;
        }

        @media (max-width: 767px) {
            #elf-detail-view { --stage-w: clamp(140px, min(58vw, 30vh), 300px); }
        }

        .elf-card { transition: all 0.2s ease; }
        .elf-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="cyber-grid relative flex flex-col w-full h-full">
    <div id="menu-container"></div>

    <!-- 상단 헤더 -->
    <div class="w-full h-14 sm:h-16 border-b border-sky-500/30 bg-slate-950/60 backdrop-blur-md px-3 sm:px-6 flex items-center justify-between gap-2 z-30 flex-shrink-0">
        <div class="flex items-center gap-4 min-w-0">
            <a href="InMonatium.html" class="px-3 sm:px-4 py-2 bg-sky-900/50 hover:bg-sky-800/80 border border-sky-400/50 rounded-xl text-sky-200 text-[11px] sm:text-xs font-bold flex items-center gap-2 backdrop-blur-md transition-all shadow-lg whitespace-nowrap">
                <i class="fa-solid fa-arrow-left"></i>
                <span>모나티엄으로 돌아가기</span>
            </a>
        </div>
        
        <div id="view-mode-title" class="text-white font-extrabold text-xs sm:text-sm whitespace-nowrap">엘프 목록</div>

        <!-- 오른쪽 상단: 엘프 교육권 표시 -->
        <div class="flex items-center gap-2 bg-amber-500/20 border border-amber-400/40 px-3 py-1.5 rounded-xl shadow-lg">
            <i class="fa-solid fa-certificate text-amber-400 text-sm sm:text-base"></i>
            <span class="text-amber-300 font-bold text-xs sm:text-sm">교육권:</span>
            <span id="education-ticket-count" class="text-white font-black text-xs sm:text-sm">0</span>
        </div>
    </div>

    <!-- 1. 격자형 엘프 목록 화면 -->
    <div id="elf-grid-view" class="w-full flex-1 min-h-0 p-4 sm:p-8 overflow-y-auto z-10 flex flex-col items-center">
        <div id="elf-grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-6 w-full max-w-6xl">
            <!-- 자바스크립트로 칸나 및 25명 적성 엘프 자동 생성 -->
        </div>
    </div>

    <!-- 2. 엘프 상세 프로필 화면 -->
    <div id="elf-detail-view" class="hidden w-full flex-1 min-h-0 flex flex-col md:flex-row relative overflow-hidden z-10">
        <div class="w-full md:w-[70%] h-[55%] md:h-full flex-shrink-0 flex flex-col items-center justify-center relative border-b md:border-b-0 md:border-r border-sky-500/30 px-4 pt-14 pb-4">
            <button onclick="showGridView()" class="absolute top-3 left-3 sm:top-6 sm:left-6 px-3 sm:px-4 py-2 bg-slate-900/60 hover:bg-slate-800 border border-sky-400/40 rounded-xl text-sky-300 text-[11px] sm:text-xs font-bold flex items-center gap-2 backdrop-blur-md transition-all shadow-lg cursor-pointer z-20">
                <i class="fa-solid fa-list"></i>
                <span>목록으로</span>
            </button>

            <div class="stage">
                <img id="elf-img" src="cannatemp.png" alt="엘프" class="stage-elf">
                <div class="platform-halo"></div>
            </div>
        </div>

        <div class="w-full md:w-[30%] flex-1 min-h-0 md:h-full bg-slate-950/90 backdrop-blur-md p-4 sm:p-6 flex flex-col justify-between border-l-0 md:border-l border-sky-400/20 shadow-2xl overflow-y-auto">
            <div>
                <div class="border-b border-sky-500/30 pb-3 sm:pb-4 mb-4 sm:mb-5">
                    <h1 id="elf-name-title" class="text-2xl lg:text-3xl font-black text-white flex items-center gap-2">
                        <span id="detail-name-text">칸나</span>
                        <span id="duplicate-status" class="text-sky-400 font-bold">(+0)</span>
                        <span id="grade-badge" class="hidden text-xs bg-amber-400 text-black px-2 py-0.5 rounded-full font-bold">(상급)</span>
                    </h1>
                </div>

                <div class="bg-slate-900/80 border border-sky-500/40 rounded-xl p-3 sm:p-4 space-y-3 shadow-lg">
                    <div class="text-xs font-bold text-sky-400 tracking-wider border-b border-sky-900/60 pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>능력치 정보</span>
                    </div>
                    <div id="detail-ability-text" class="text-slate-200 text-sm font-bold leading-relaxed pt-1">
                        전투력 +25%
                    </div>
                </div>
            </div>

            <div class="text-[10px] font-mono text-slate-500 text-center pt-4">
                MONATIUM_SPECIAL_REGISTRY_v1.0
            </div>
        </div>
    </div>

    <script>
        const ROLE_NAMES = {
            army: '군인 엘프',
            backsu: '백수 엘프',
            doctor: '의사 엘프',
            spy: '스파이 엘프',
            citizen: '시민 엘프'
        };

        const ROLE_DEFAULT_IMGS = {
            army: 'army.png',
            backsu: 'backsu.png',
            doctor: 'doctor.png',
            spy: 'spy.png',
            citizen: 'Citizen.png' // Citizen.png 파일명 연결 보완
        };

        const ROLE_DESCS = {
            army: '전투력 +10%',
            backsu: '획득 모든 최종 기술력 +1',
            doctor: '효율성 +10%',
            spy: '원정 성공률 +1%',
            citizen: '총 효율성 +15'
        };

        function loadMenuEngine() {
            fetch('menu.html').then(res => res.text()).then(html => {
                const container = document.getElementById('menu-container');
                if (!container) return;
                container.innerHTML = html;
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            }).catch(e => {});
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMenuEngine();
            renderAllElves();
        });

        function renderAllElves() {
            const gridContainer = document.getElementById('elf-grid-container');
            gridContainer.innerHTML = '';

            let saveObj = {};
            try {
                const raw = localStorage.getItem('ELIAS_AWAY_SAVE_DATA_V1') || '{}';
                saveObj = JSON.parse(raw);
            } catch(e) {
                console.error(e);
            }

            const progress = saveObj.progress || {};
            const specialElves = progress.specialElves || {};
            const monatiumCitizens = progress.monatiumCitizens || [];
            
            // 보유 교육권 계산
            let totalTickets = progress.elfEducationTickets || 0;
            if (progress.epicElfTrainingTickets) {
                Object.values(progress.epicElfTrainingTickets).forEach(v => totalTickets += (v || 0));
            }
            document.getElementById('education-ticket-count').innerText = totalTickets;

            // 1. 칸나 카드 추가
            const cannaCount = specialElves.canna || 0;
            const cannaPlus = Math.max(0, cannaCount - 1);
            const cannaData = monatiumCitizens.find(c => c.role === 'canna');
            const cannaHigh = cannaData && cannaData.isHighGrade;

            const cannaCard = document.createElement('div');
            cannaCard.className = 'elf-card bg-slate-900/80 border border-sky-500/40 hover:border-sky-400 rounded-2xl p-3 sm:p-4 flex flex-col items-center justify-between cursor-pointer backdrop-blur-md shadow-xl group';
            cannaCard.onclick = () => selectElf('canna', '칸나', 'cannatemp.png', '특수능력: 세계수 오라 & 전원 가공', cannaPlus, cannaHigh);
            cannaCard.innerHTML = `
                <div class="w-full h-36 sm:h-44 flex items-center justify-center relative overflow-hidden rounded-xl bg-slate-950/50 border border-sky-900/50 mb-3">
                    <img src="cannatemp.png" alt="칸나" class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300 drop-shadow-[0_4px_12px_rgba(56,189,248,0.4)]">
                </div>
                <div class="w-full text-center">
                    <div class="text-white font-black text-sm sm:text-base flex items-center justify-center gap-1">
                        <span>칸나(+${cannaPlus})</span>
                        ${cannaHigh ? `<span class="text-[10px] bg-amber-400 text-black px-1.5 py-0.2 rounded-full font-bold">(상급)</span>` : ''}
                    </div>
                </div>
            `;
            gridContainer.appendChild(cannaCard);

            // 2. 적성 엘프 25명 카드 추가 (5종류 × 5명)
            const roles = ['army', 'backsu', 'doctor', 'spy', 'citizen'];
            
            roles.forEach(role => {
                const roleList = monatiumCitizens.filter(c => c.role === role);
                for (let i = 0; i < 5; i++) {
                    const elf = roleList[i];
                    const isUnlocked = !!elf;
                    const name = `${ROLE_NAMES[role]} #${i + 1}`;
                    
                    // Citizen 및 백수 등 저장 데이터 내 고유 이미지 경로 우선적용
                    const img = elf && elf.img ? elf.img : ROLE_DEFAULT_IMGS[role];
                    const isHigh = elf ? !!elf.isHighGrade : false;
                    const desc = ROLE_DESCS[role] || '적성 능력을 보유하고 있습니다.';

                    const card = document.createElement('div');
                    card.className = `elf-card bg-slate-900/80 border ${isUnlocked ? 'border-sky-500/40 hover:border-sky-400 cursor-pointer' : 'border-slate-800 opacity-40'} rounded-2xl p-3 sm:p-4 flex flex-col items-center justify-between backdrop-blur-md shadow-xl group`;
                    if (isUnlocked) {
                        card.onclick = () => selectElf(role, name, img, desc, 0, isHigh);
                    }
                    card.innerHTML = `
                        <div class="w-full h-36 sm:h-44 flex items-center justify-center relative overflow-hidden rounded-xl bg-slate-950/50 border border-sky-900/50 mb-3">
                            <img src="${img}" alt="${name}" class="max-h-full max-w-full object-contain ${isUnlocked ? 'group-hover:scale-105' : 'grayscale'} transition-transform duration-300 drop-shadow-[0_4px_12px_rgba(56,189,248,0.4)]" onerror="this.src='Citizen.png'">
                        </div>
                        <div class="w-full text-center">
                            <div class="text-white font-black text-sm sm:text-base flex items-center justify-center gap-1">
                                <span>${name}</span>
                                ${isHigh ? `<span class="text-[10px] bg-amber-400 text-black px-1.5 py-0.2 rounded-full font-bold">(상급)</span>` : ''}
                            </div>
                        </div>
                    `;
                    gridContainer.appendChild(card);
                }
            });
        }

        function selectElf(id, name, img, abilityText, plusLvl = 0, isHigh = false) {
            const elfImg = document.getElementById('elf-img');
            elfImg.src = img;
            elfImg.onerror = () => { elfImg.src = 'Citizen.png'; };

            document.getElementById('detail-name-text').innerText = name;
            document.getElementById('duplicate-status').innerText = `(+${plusLvl})`;
            document.getElementById('detail-ability-text').innerText = abilityText;

            const badge = document.getElementById('grade-badge');
            if (isHigh) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            showElfDetail();
        }

        function showElfDetail() {
            document.getElementById('elf-grid-view').classList.add('hidden');
            document.getElementById('elf-detail-view').classList.remove('hidden');
            document.getElementById('view-mode-title').innerText = "엘프 프로필 정보";
        }

        function showGridView() {
            document.getElementById('elf-detail-view').classList.add('hidden');
            document.getElementById('elf-grid-view').classList.remove('hidden');
            document.getElementById('view-mode-title').innerText = "엘프 목록";
        }
    </script>
</body>
</html>
