<!-- epicelf.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>특별 엘프 - 엘프 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; font-family: 'Gothic A1', sans-serif; box-sizing: border-box; }
        body {
            background-color: #030a16;
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 연파랑 네온 사이버틱 격자 배경 */
        .cyber-grid {
            background-color: #030d1e;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            box-shadow: inset 0 0 100px rgba(14, 165, 233, 0.2);
        }

        /* 하얀 네온 헤일로 단상 */
        .platform-halo {
            width: 220px;
            height: 50px;
            background: #000000;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 40px rgba(56, 189, 248, 0.8), inset 0 0 15px #ffffff;
            position: relative;
        }

        .elf-card {
            transition: all 0.2s ease;
        }
        .elf-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="cyber-grid relative flex flex-col w-full h-full">

    <!-- 상단 공통 헤더 (InMonatium으로 돌아가기 버튼) -->
    <div class="w-full h-16 border-b border-sky-500/30 bg-slate-950/60 backdrop-blur-md px-6 flex items-center justify-between z-30 flex-shrink-0">
        <div class="flex items-center gap-4">
            <a href="InMonatium.html" class="px-4 py-2 bg-sky-900/50 hover:bg-sky-800/80 border border-sky-400/50 rounded-xl text-sky-200 text-xs font-bold flex items-center gap-2 backdrop-blur-md transition-all shadow-lg">
                <i class="fa-solid fa-arrow-left"></i>
                <span>모나티엄으로 돌아가기</span>
            </a>
            <span class="text-sky-400 font-mono text-xs tracking-widest">// SPECIAL_ELF_REGISTRY</span>
        </div>
        <div id="view-mode-title" class="text-white font-extrabold text-sm">특별 엘프 목록</div>
    </div>

    <!-- 1. 격자형 엘프 목록 화면 (기본 화면) -->
    <div id="elf-grid-view" class="w-full flex-1 p-8 overflow-y-auto z-10 flex flex-col items-center">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 w-full max-w-6xl">
            <!-- 칸나 프로필 카드 -->
            <div onclick="showElfDetail('canna')" class="elf-card bg-slate-900/80 border border-sky-500/40 hover:border-sky-400 rounded-2xl p-4 flex flex-col items-center justify-between cursor-pointer backdrop-blur-md shadow-xl group">
                <div class="w-full h-44 flex items-center justify-center relative overflow-hidden rounded-xl bg-slate-950/50 border border-sky-900/50 mb-3">
                    <img src="cannatemp.png" alt="칸나" class="max-h-full object-contain group-hover:scale-105 transition-transform duration-300 drop-shadow-[0_4px_12px_rgba(56,189,248,0.4)]">
                </div>
                <div class="w-full text-center">
                    <div class="text-white font-black text-base flex items-center justify-center gap-1">
                        <span>칸나</span>
                        <span id="grid-canna-grade" class="hidden text-[10px] bg-amber-400 text-black px-1.5 py-0.2 rounded-full font-bold">(상급)</span>
                    </div>
                    <div id="grid-canna-dup" class="text-sky-400 text-xs font-bold font-mono mt-1">&lt;특별 엘프&gt;(+0)</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 엘프 상세 프로필 화면 (초기 숨김) -->
    <div id="elf-detail-view" class="hidden w-full flex-1 flex relative overflow-hidden z-10">
        <!-- 좌측 70%: 단상 및 엘프 일러스트 -->
        <div class="w-[70%] h-full flex flex-col items-center justify-center relative border-r border-sky-500/30">
            <button onclick="showGridView()" class="absolute top-6 left-6 px-4 py-2 bg-slate-900/60 hover:bg-slate-800 border border-sky-400/40 rounded-xl text-sky-300 text-xs font-bold flex items-center gap-2 backdrop-blur-md transition-all shadow-lg cursor-pointer">
                <i class="fa-solid fa-list"></i>
                <span>목록으로</span>
            </button>

            <!-- 엘프 일러스트 & 단상 (이미지 높이를 h-[45%]로 줄여 크기를 축소함) -->
            <div class="relative flex flex-col items-center justify-end h-[65%]">
                <img id="elf-img" src="cannatemp.png" alt="칸나" class="h-[45%] object-contain z-10 drop-shadow-[0_10px_25px_rgba(56,189,248,0.5)] mb-[-18px]">
                <!-- 검은색 + 하얀 네온 헤일로 단상 -->
                <div class="platform-halo"></div>
            </div>
        </div>

        <!-- 우측 30%: 상태창 전용 영역 -->
        <div class="w-[30%] h-full bg-slate-950/80 backdrop-blur-md p-6 flex flex-col justify-between border-l border-sky-400/20 shadow-2xl">
            <div>
                <div class="text-[10px] font-mono text-sky-400 tracking-widest uppercase mb-1">// SPECIAL_ELF_PROFILE</div>
                <h1 id="elf-name-title" class="text-2xl font-black text-white mb-2 flex items-center gap-2">
                    <span>칸나</span>
                    <span id="grade-badge" class="hidden text-xs bg-amber-400 text-black px-2 py-0.5 rounded-full font-bold">(상급)</span>
                </h1>
                
                <!-- 대충 스탯 표시 영역 -->
                <div class="text-slate-300 text-sm font-bold mt-2">
                    대충 스탯
                </div>
            </div>

            <div class="text-[10px] font-mono text-slate-500 text-center">
                MONATIUM_SPECIAL_REGISTRY_v1.0
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const raw = localStorage.getItem('ELIAS_AWAY_SAVE_DATA_V1') || '{}';
                const saveObj = JSON.parse(raw);
                const count = (saveObj.progress && saveObj.progress.specialElves && saveObj.progress.specialElves.canna) || 0;
                
                // 중복 획득 수 반영
                const bonusCount = Math.max(0, count - 1);
                const dupText = `<특별 엘프>(+${bonusCount})`;
                document.getElementById('duplicate-status').innerText = dupText;
                document.getElementById('grid-canna-dup').innerText = dupText;

                // 상급 여부 반영
                const citizens = (saveObj.progress && saveObj.progress.monatiumCitizens) || [];
                const cannaData = citizens.find(c => c.role === 'canna');
                if (cannaData && cannaData.isHighGrade) {
                    document.getElementById('grade-badge').classList.remove('hidden');
                    document.getElementById('grid-canna-grade').classList.remove('hidden');
                }
            } catch(e) {
                console.error(e);
            }
        });

        function showElfDetail(elfId) {
            document.getElementById('elf-grid-view').classList.add('hidden');
            document.getElementById('elf-detail-view').classList.remove('hidden');
            document.getElementById('view-mode-title').innerText = "엘프 프로필 정보";
        }

        function showGridView() {
            document.getElementById('elf-detail-view').classList.add('hidden');
            document.getElementById('elf-grid-view').classList.remove('hidden');
            document.getElementById('view-mode-title').innerText = "특별 엘프 목록";
        }
    </script>
</body>
</html>
