<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: visible; }
    </style>
</head>
<body class="w-full h-full flex items-center justify-center p-3">

    <!-- 건물 카드 본체 -->
    <div class="relative w-full h-full bg-slate-900 border-2 border-amber-400/80 rounded-2xl flex flex-col items-center justify-center shadow-xl overflow-visible">
        
        <!-- 1. 건물 대표 아이콘 (중앙 아이콘 크기: text-2xl -> text-5xl 로 확대) -->
        <div class="text-amber-400 text-20xl flex items-center justify-center">
            <i class="fa-solid fa-battery-full"></i>
        </div>

        <!-- 2. 좌측 하단 감자 뱃지 아이콘 -->
        <!-- 동그라미 자체 크기를 w-12 h-12로 키우고 폰트 크기를 text-2xl로 맞춤 -->
        <div class="absolute -bottom-2 -left-2 w-60 h-60 bg-amber-500 border-2 border-slate-950 rounded-full flex items-center justify-center shadow-md text-slate-950 text-10xl z-10">
            <i class="fa-solid fa-database"></i>
        </div>

    </div>

</body>
</html>
